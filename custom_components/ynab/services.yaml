update_transaction:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ynab
    transaction_id:
      required: true
      example: "7c1a2b3c-0000-0000-0000-000000000000"
      selector:
        text:
    category:
      description: Category id or exact name.
      example: Groceries
      selector:
        text:
    payee_name:
      example: Costco
      selector:
        text:
    memo:
      selector:
        text:
    approve:
      default: false
      selector:
        boolean:
    force:
      description: Allow changing an already-approved transaction.
      default: false
      selector:
        boolean:
update_transactions:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ynab
    updates:
      required: true
      description: List of updates; each has transaction_id and optional category, payee_name, memo, approve, force.
      example: '[{"transaction_id": "abc", "category": "Groceries", "approve": true}]'
      selector:
        object:
assign_money:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ynab
    category:
      required: true
      description: Category id or exact name.
      selector:
        text:
    amount:
      required: true
      description: Amount in the plan currency.
      selector:
        number:
          mode: box
          step: any
    month:
      default: current
      description: '"current" or a month as YYYY-MM-01.'
      selector:
        text:
    mode:
      default: set
      selector:
        select:
          options:
            - set
            - add
refresh:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ynab
propose_transaction_update:
  description: Record a suggested transaction change. Nothing changes in YNAB until it is approved.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ynab
    transaction_id:
      required: true
      selector:
        text:
    category:
      description: Category id or exact name.
      selector:
        text:
    payee_name:
      selector:
        text:
    memo:
      selector:
        text:
    approve:
      description: Whether approving the proposal also approves the transaction (default true).
      selector:
        boolean:
approve_proposals:
  description: Apply pending proposals to YNAB.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ynab
    proposal_ids:
      required: true
      example: '["p-1a2b3c"]'
      selector:
        object:
reject_proposals:
  description: Dismiss pending proposals without changing YNAB.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ynab
    proposal_ids:
      required: true
      example: '["p-1a2b3c"]'
      selector:
        object:
list_proposals:
  description: Return proposals (response only).
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ynab
    status:
      default: pending
      selector:
        select:
          options:
            - pending
            - approved
            - rejected
            - stale
            - applied
            - partial
            - superseded
            - all
propose_allocation:
  description: Propose how to assign Ready to Assign across categories in priority order (response only). Nothing changes in YNAB until the proposal is approved or applied.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ynab
apply_allocation:
  description: Apply a pending allocation proposal to YNAB (response only).
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ynab
    proposal_id:
      required: true
      example: "a-1a2b3c"
      selector:
        text:
